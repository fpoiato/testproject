version: 0.2

# Build do Angular com config do ambiente (gerada a partir das env vars do
# CodeBuild) e deploy para o bucket S3 + invalidacao do CloudFront.
phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      - cd frontend
      - npm ci
      - echo "Gerando config e buildando para $ENVIRONMENT (API_URL=$API_URL)"
      - npm run build
      - aws s3 sync dist/frontend/browser "s3://$FRONTEND_BUCKET/" --delete
      - aws cloudfront create-invalidation --distribution-id "$CF_DISTRIBUTION_ID" --paths "/*"
  post_build:
    commands:
      - echo "Frontend deploy concluido para $ENVIRONMENT (bucket $FRONTEND_BUCKET)"
