version: 0.2

# Deploy do backend: empacota src/, publica nova versao de cada Lambda e move o
# alias do ambiente (LAMBDA_ALIAS) para a nova versao. Sem CDK.
phases:
  build:
    commands:
      - echo "Ambiente=$ENVIRONMENT alias=$LAMBDA_ALIAS"
      - cd backend
      - rm -f function.zip
      - (cd src && zip -qr ../function.zip . -x "*.test.js")
      - |
        set -e
        for FN in $FUNCTIONS; do
          NAME="testproject-$FN"
          echo "==> $NAME"
          VERSION=$(aws lambda update-function-code --function-name "$NAME" --zip-file fileb://function.zip --publish --query Version --output text)
          aws lambda wait function-updated --function-name "$NAME"
          aws lambda update-alias --function-name "$NAME" --name "$LAMBDA_ALIAS" --function-version "$VERSION"
          echo "    versao $VERSION -> alias $LAMBDA_ALIAS"
        done
  post_build:
    commands:
      - echo "Backend deploy concluido para $ENVIRONMENT"
