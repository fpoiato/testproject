name: PR Validation

on:
  pull_request:
    branches:
      - development
      - test
      - staging
      - production-blue
      - production-green
  push:
    branches:
      - development
      - test
      - staging
      - production-blue
      - production-green

jobs:
  lint:
    name: Terraform Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Terraform files changed
        id: check-tf
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E 'infra/.*\.tf$' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        if: steps.check-tf.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Format Check
        if: steps.check-tf.outputs.changed == 'true'
        run: |
          cd infra/terraform
          terraform fmt -recursive -check
        continue-on-error: false

      - name: Terraform Validate
        if: steps.check-tf.outputs.changed == 'true'
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform validate
        continue-on-error: false

  cdk-lint:
    name: CDK TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if CDK files changed
        id: check-cdk
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E 'cdk/.*\.(ts|js|json)$' && echo "changed=true" >> $GITHUB_OUTPUT || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check-cdk.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'cdk/sam-app-cdk/package-lock.json'

      - name: Install CDK Dependencies
        if: steps.check-cdk.outputs.changed == 'true'
        run: |
          cd cdk/sam-app-cdk
          npm ci

      - name: TypeScript Lint
        if: steps.check-cdk.outputs.changed == 'true'
        run: |
          cd cdk/sam-app-cdk
          npm run build
        continue-on-error: false

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [cdk-lint]
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          ls -la frontend/ 2>/dev/null || echo "No frontend directory yet"
        continue-on-error: true

      - name: Run Frontend Tests
        run: |
          echo "Running unit tests for frontend..."
          ls -la frontend/ 2>/dev/null && cd frontend && npm test || echo "No frontend yet - skipping"
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs: [lint, cdk-lint, test-backend, test-frontend, security-scan]
    if: always()
    steps:
      - name: Check All Jobs
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Lint | ${{ needs.lint.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CDK Lint | ${{ needs.cdk-lint.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.test-frontend.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
